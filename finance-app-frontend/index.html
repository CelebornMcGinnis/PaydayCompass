<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>PaydayCompass</title>
    <meta name="theme-color" content="#0F1B2D" />

    <!-- Two favicon variants matching the browser/OS color scheme - the
         dark-mode one uses light linework so it stays visible against a
         dark browser chrome, and vice versa for light mode. -->
    <link rel="icon" type="image/png" href="/paydaycompass-favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/paydaycompass-favicon-light.png" media="(prefers-color-scheme: light)" />
    <!-- Fallback for browsers that don't evaluate media on <link rel="icon"> -->
    <link rel="icon" type="image/png" href="/paydaycompass-favicon-dark.png" />
    <!-- iOS home-screen icon -->
    <link rel="apple-touch-icon" href="/paydaycompass-favicon-light.png" />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
